name: english_treasure
description: 英语宝典 — 覆盖全学段的英语学习 App
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  # 状态管理
  riverpod: ^2.5.0
  flutter_riverpod: ^2.5.0
  # 路由
  go_router: ^14.0.0
  # 网络
  dio: ^5.4.0
  # 本地存储
  sqflite: ^2.3.0
  shared_preferences: ^2.2.0
  # UI
  fl_chart: ^0.68.0
  google_fonts: ^6.2.0
  flutter_tts: ^4.0.0
  # 录音
  record: ^5.0.0
  audio_waveforms: ^1.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  assets: []
